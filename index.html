  function b64(x) {
    var s = atob(x), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function tryKey(key) {
    var b = b64(CT);
    return crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12)
    ).then(function (p) { return new TextDecoder().decode(p); });
  }
  function derive(pass) {
    return crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]
    ).then(function (km) {

        km, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    });
  }
  /* remembered device: silent unlock, no flash of the form on success */
  var jwk = null;
  try { jwk = JSON.parse(localStorage.getItem("gexweb.key.v1") || "null"); }
  catch (e) {}
  if (jwk) {
    crypto.subtle.importKey("jwk", jwk, { name: "AES-GCM" }, true,

  function go() {
    var pass = document.getElementById("pw").value || "";
    var m = document.getElementById("msg");
    m.textContent = "checking…";
    derive(pass).then(function (key) {
      return tryKey(key).then(function (html) {
        return crypto.subtle.exportKey("jwk", key).then(function (j) {

  document.getElementById("pw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") go();
  });
